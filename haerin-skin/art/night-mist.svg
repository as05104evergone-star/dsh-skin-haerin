<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- 海粼 · 夜：墨底 + 花影。整张近黑，右下角一点暖红（照片里那朵花的光），
       左上留一点冷蓝，其余交给照片自己。 -->
  <defs>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#0a0b10" />
      <stop offset="0.45" stop-color="#0c0a0a" />
      <stop offset="1" stop-color="#080808" />
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3545c" stop-opacity="0.34" />
      <stop offset="0.5" stop-color="#8c3a43" stop-opacity="0.13" />
      <stop offset="1" stop-color="#8c3a43" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3f5f92" stop-opacity="0.22" />
      <stop offset="1" stop-color="#3f5f92" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="handover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" />
      <stop offset="0.45" stop-color="#e8e8e8" />
      <stop offset="0.8" stop-color="#8a8a8a" />
      <stop offset="1" stop-color="#4a4a4a" />
    </linearGradient>
    <mask id="fade">
      <rect width="1600" height="1000" fill="url(#handover)" />
    </mask>
  </defs>

  <g mask="url(#fade)">
    <rect width="1600" height="1000" fill="url(#ink)" />
    <ellipse cx="320" cy="180" rx="600" ry="440" fill="url(#cold)" />
    <ellipse cx="1320" cy="800" rx="620" ry="440" fill="url(#ember)" />
    <ellipse cx="1180" cy="220" rx="420" ry="320" fill="url(#ember)" opacity="0.7" />

    <!-- 夜色里的水面 -->
    <g fill="none" stroke="#c98a90" stroke-linecap="round">
      <path d="M-40 760 q 150 -22 300 0 t 300 0 t 300 0 t 300 0 t 300 0 t 300 0" stroke-opacity="0.09" stroke-width="2" />
      <path d="M-40 828 q 150 -18 300 0 t 300 0 t 300 0 t 300 0 t 300 0 t 300 0" stroke-opacity="0.06" stroke-width="2" />
    </g>
  </g>
</svg>
